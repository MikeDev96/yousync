name: Build

on:
  push:
    branches: [master]
  # Lets you rebuild from the Actions tab without pushing a commit.
  workflow_dispatch:

# One build at a time, so two pushes cannot race to publish :latest.
concurrency:
  group: build
  cancel-in-progress: false

env:
  # ghcr.io requires a lowercase path.
  IMAGE: ghcr.io/mikedev96/yousync

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    if: github.repository == 'MikeDev96/yousync'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read with git rather than interpolated from the event payload: a commit
      # subject is untrusted text, and ${{ }} inside a run block would let it
      # run as shell.
      - name: Describe the build
        id: build_meta
        run: echo "subject=$(git log -1 --pretty=%s | cut -c1-100)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Baked in so /api/health can name what shipped.
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ steps.build_meta.outputs.subject }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Layer cache lives in the Actions cache, so unchanged deps are reused.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the package listing to a single plain image.
          provenance: false
