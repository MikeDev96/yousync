services:
  app:
    # Pulled from GHCR in deployment. `build: .` is kept so a local
    # `docker compose up -d --build` still works from a source checkout.
    # YOUSYNC_TAG lets you roll back: YOUSYNC_TAG=<sha> docker compose up -d
    image: ghcr.io/mikedev96/yousync:${YOUSYNC_TAG:-latest}
    build: .
    container_name: yousync
    restart: unless-stopped
    ports:
      # Host port, set YOUSYNC_PORT in `.env` to change it. It has to live in
      # the file compose itself reads, not in one passed to the container.
      - "${YOUSYNC_PORT:-4001}:4001"
    environment:
      # Required: without it every attempt to add a video fails at the point
      # the server asks the Data API how long it is.
      GOOGLE_YOUTUBE_DATA_API_V3_API_KEY: "${GOOGLE_YOUTUBE_DATA_API_V3_API_KEY:?set this in .env}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      start_period: 10s
      retries: 3
